services:
    server:
        image: hire-happy-server
        container_name: hire-happy-server
        restart: unless-stopped
        build:
            context: ../../
            dockerfile: ./infra/docker/backend/Dockerfile
        volumes:
            - static_volume:/app/static-files
        expose:
            - 8000
        depends_on:
            rabbitmq:
                condition: service_started
            mysql:
                condition: service_healthy  
    frontend:
        image: hire-happy-frontend
        container_name: hire-happy-frontend
        restart: unless-stopped
        build:
            context: ../../
            dockerfile: ./infra/docker/frontend/Dockerfile
        ports:
            - 80:80        
        volumes:
            - static_volume:/app/static-files
    mysql:
        image: mysql
        container_name: mysql
        restart: always
        ports:
          - 3306:3306     
        build:
            context: ../../   
        env_file: 
            - ../env/.mysql.env
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 20s
    rabbitmq:
      image: rabbitmq:latest
      container_name: rabbitmq      
volumes:
    static_volume: {}