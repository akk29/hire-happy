services:
    nginx:
        container_name: nginx
        restart: always
        image: nginx:1.23-alpine
        ports:
            - 8000:80
        build:
            context: ../../            
        expose:
            - 80
        volumes:
            - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - static_volume:/app/static
    db:
        container_name: mysql-database
        image: mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: rootPassword
            MYSQL_DATABASE: hirehappydb
            MYSQL_USER: hirehappyuser
            MYSQL_PASSWORD: rootpassword
        expose:
            - 3306:3306
        healthcheck:
            test: "exit 0"
    server:
        image: hire-happy-server
        restart: unless-stopped
        build:
            context: ../../
            dockerfile: ./infra/docker/backend/Dockerfile
        volumes:
            - static_volume:/app/static
        expose:
            - 8000
    frontend:
        image: hire-happy-frontend
        restart: unless-stopped
        build:
            context: ../../
            dockerfile: ./infra/docker/frontend/Dockerfile
        ports:
            - 80:80        
    rabbitmq:
      image: rabbitmq:latest
    worker:
      image: hire-happy-worker   
      build:
            context: ../../
            dockerfile: ./infra/docker/backend/Dockerfile
      command:
        celery -A hirehappy.celery worker --pool=solo --loglevel=info
      restart: on-failure:10
      volumes:
            - static_volume:/usr/src/app/static
      depends_on:
        - rabbitmq
        - server        
volumes:
    static_volume: {}