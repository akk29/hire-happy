services:
    nginx:
        restart: always
        image: nginx:1.23-alpine
        ports:
            - 8000:80
        build:
            context: ../../            
        expose:
            - 80
        volumes:
            - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - static_volume:/app/static
    server:
        restart: unless-stopped
        build:
            context: ../../
            dockerfile: ./infra/docker/backend/Dockerfile
        volumes:
            - static_volume:/app/static
        expose:
            - 8000
    frontend:
        restart: unless-stopped
        build:
            context: ../../
            dockerfile: ./infra/docker/frontend/Dockerfile
        ports:
            - 80:80        
    rabbitmq:
      image: rabbitmq:latest
    worker:
      build:
            context: ../../
            dockerfile: ./infra/docker/backend/Dockerfile
      command:
        celery -A hirehappy.celery worker --pool=solo --loglevel=info
      volumes:
            - static_volume:/usr/src/app/static
      depends_on:
        - rabbitmq
        - server
volumes:
    static_volume: {}